<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>個別株ノート</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1b3a6b; --navy-dk:#0f2547; --navy-lt:#2d5ca8;
  --bg:#f2f5fb; --surface:#fff; --surface-2:#f7fafe;
  --border:#d4dff0; --shadow:rgba(15,37,71,.1);
  --text:#0d1f3c; --text-sub:#4a5c78; --text-lt:#8fa3c0;
  --good:#0d6b43; --good-bg:#e6f5ee;
  --warn:#9a5800; --warn-bg:#fdf3e2;
  --bad:#b52828;  --bad-bg:#fdecec;
  --up:#b52828; --down:#1a6fb5;
  --c1:#2d5ca8; --c2:#0d8a6a; --c3:#b5762b; --c4:#8b4fa8; --c5:#b52828;
  --hdr:54px; --tab:40px;
  --r:8px; --r-lg:14px; --r-sm:5px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
}
:root[data-theme="dark"]{
  --navy:#16294a; --navy-dk:#0d1a30; --navy-lt:#6ba3f0;
  --bg:#0f1622; --surface:#18202e; --surface-2:#1e2736;
  --border:#2c3a4f; --shadow:rgba(0,0,0,.4);
  --text:#e6ecf5; --text-sub:#a2b2c8; --text-lt:#6b7d96;
  --good:#4ade80; --good-bg:#153025;
  --warn:#fbbf24; --warn-bg:#332609;
  --bad:#f87171;  --bad-bg:#3a1a1a;
  --up:#f87171; --down:#60a5fa;
  --c1:#60a5fa; --c2:#34d399; --c3:#fbbf24; --c4:#c084fc; --c5:#f87171;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#16294a; --navy-dk:#0d1a30; --navy-lt:#6ba3f0;
    --bg:#0f1622; --surface:#18202e; --surface-2:#1e2736;
    --border:#2c3a4f; --shadow:rgba(0,0,0,.4);
    --text:#e6ecf5; --text-sub:#a2b2c8; --text-lt:#6b7d96;
    --good:#4ade80; --good-bg:#153025;
    --warn:#fbbf24; --warn-bg:#332609;
    --bad:#f87171;  --bad-bg:#3a1a1a;
    --up:#f87171; --down:#60a5fa;
    --c1:#60a5fa; --c2:#34d399; --c3:#fbbf24; --c4:#c084fc; --c5:#f87171;
  }
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
.hidden{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:100;height:var(--hdr);background:linear-gradient(135deg,var(--navy-dk),var(--navy));display:flex;align-items:center;padding:0 12px;gap:8px;box-shadow:0 2px 12px rgba(15,37,71,.25)}
.hdr-title{font-size:16px;font-weight:700;color:#fff;flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.hdr-title small{font-size:11px;font-weight:400;opacity:.6}
.save-status{font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap;display:flex;align-items:center;gap:4px}
.save-status.ok{color:#6ee7b7}.save-status.pending{color:#fcd34d}.save-status.err{color:#fca5a5}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;line-height:1.2;white-space:nowrap;font-family:var(--font);transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-white{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:transparent;color:var(--text-sub);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--navy-lt);color:var(--navy-lt)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:5px 9px;font-size:12px}
.menu{position:fixed;top:calc(var(--hdr) + 4px);right:8px;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px var(--shadow);padding:5px 0;min-width:210px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 15px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--text);font-family:var(--font)}
.menu-item:hover{background:var(--bg)}
.menu-item.red{color:var(--bad)}
.menu-sep{margin:4px 0;border:none;border-top:1px solid var(--border)}

/* tabs + filter */
.tabs{position:sticky;top:var(--hdr);z-index:95;height:var(--tab);background:var(--navy-dk);display:flex}
.tab{flex:1;max-width:150px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;font-family:var(--font)}
.tab.active{color:#fff;border-bottom-color:var(--navy-lt)}
.fbar{position:sticky;top:calc(var(--hdr) + var(--tab));z-index:90;background:var(--surface);border-bottom:1px solid var(--border);padding:9px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fin{flex:1;min-width:150px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:var(--font)}
.fin:focus{border-color:var(--navy-lt)}
.fsel{padding:7px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;background:var(--bg);color:var(--text);cursor:pointer;font-family:var(--font);outline:none}
.stats{padding:7px 14px;font-size:12px;color:var(--text-lt)}

/* cards */
.grid{padding:6px 12px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 3px var(--shadow);cursor:pointer;overflow:hidden;transition:box-shadow .2s,transform .12s}
.card:hover{box-shadow:0 4px 14px var(--shadow);transform:translateY(-1px)}
.card-hd{padding:11px 13px 8px;display:flex;align-items:flex-start;gap:9px}
.tick{font-family:var(--mono);font-size:12px;color:var(--text-lt);letter-spacing:.4px}
.cname{font-size:15px;font-weight:700;line-height:1.3;word-break:break-word}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
.b-holding{background:var(--good-bg);color:var(--good)}
.b-watching{background:rgba(45,92,168,.12);color:var(--navy-lt)}
.b-sold{background:var(--bg);color:var(--text-lt);border:1px solid var(--border)}
.b-archived{background:var(--bg);color:var(--text-lt);border:1px solid var(--border)}
.card-px{padding:0 13px;display:flex;align-items:baseline;gap:8px}
.px{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.chg{font-size:12.5px;font-weight:600;font-family:var(--mono)}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.spark{padding:4px 13px 0;height:46px}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);margin-top:8px}
.mcell{background:var(--surface);padding:7px 4px;text-align:center}
.mlab{font-size:10px;color:var(--text-lt);letter-spacing:.2px}
.mval{font-family:var(--mono);font-size:14px;font-weight:700;margin-top:1px}
.mval.good{color:var(--good)}.mval.warn{color:var(--warn)}.mval.bad{color:var(--bad)}
.mval.na{color:var(--text-lt);font-weight:400}
.card-ft{padding:7px 13px;font-size:11.5px;color:var(--text-sub);background:var(--surface-2);border-top:1px solid var(--border);display:flex;gap:6px;align-items:center}
.tags{display:flex;gap:4px;flex-wrap:wrap;padding:0 13px 9px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--bg);color:var(--text-sub);border:1px solid var(--border)}

/* empty */
.empty{padding:60px 24px;text-align:center;color:var(--text-lt)}
.empty h3{font-size:16px;color:var(--text-sub);margin-bottom:8px;font-weight:600}
.empty p{font-size:13px;line-height:1.8;margin-bottom:16px}

/* detail */
.detail{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.d-hd{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy-dk),var(--navy));padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.d-hd .cname{color:#fff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-hd .tick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-hd .tick{color:rgba(255,255,255,.6)}
.d-body{padding:12px 12px 100px;max-width:1100px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.p-hd{padding:10px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.p-ti{font-size:13.5px;font-weight:700;flex:1}
.p-body{padding:12px 13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:1px;background:var(--border)}
.kpi{background:var(--surface);padding:10px 8px}
.kpi .mlab{font-size:10.5px}
.kpi .mval{font-size:17px}
.kpi .sub{font-size:10.5px;color:var(--text-lt);font-family:var(--mono)}
.seg{display:flex;border:1.5px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-sub);font-family:var(--font)}
.seg button:not(:last-child){border-right:1px solid var(--border)}
.seg button.on{background:var(--navy);color:#fff}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.chart-wrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:0 4px 14px var(--shadow);padding:7px 9px;font-size:11.5px;line-height:1.6;z-index:5;white-space:nowrap;max-width:240px;white-space:normal}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 13px 10px;font-size:11.5px;color:var(--text-sub)}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:11px;height:3px;border-radius:2px;display:inline-block}
.note{font-size:11.5px;color:var(--text-lt);line-height:1.7;padding:0 13px 11px}

/* range band */
.band{padding:9px 13px 12px;border-top:1px solid var(--border)}
.band-hd{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.band-hd b{font-weight:700}
.band-bar{position:relative;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--good-bg),var(--bg),var(--bad-bg));border:1px solid var(--border)}
.band-mk{position:absolute;top:-4px;width:3px;height:15px;border-radius:2px;background:var(--text);transform:translateX(-50%)}
.band-ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-lt);margin-top:3px;font-family:var(--mono)}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);font-size:11px;color:var(--text-sub);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}

/* decisions */
.dec{border-left:3px solid var(--border);padding:9px 12px;margin-bottom:9px;background:var(--surface-2);border-radius:0 var(--r-sm) var(--r-sm) 0}
.dec-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.dec-dt{font-family:var(--mono);font-size:12px;color:var(--text-sub)}
.act{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px}
.dec-rt{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.dec-sub{font-size:11.5px;color:var(--text-sub);margin-top:5px;line-height:1.7;white-space:pre-wrap}
.conv{font-size:11px;color:var(--text-lt);font-family:var(--mono)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(13,31,60,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:600px;max-height:92vh;border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.3)}
@media(min-width:640px){.modal{border-radius:var(--r-lg)}}
.m-hd{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.m-ti{font-size:15px;font-weight:700;flex:1}
.m-body{padding:14px 16px;overflow-y:auto;flex:1}
.m-ft{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:var(--font)}
.fg textarea{resize:vertical;min-height:70px;line-height:1.6}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy-lt)}
.fg .hint{font-size:11px;color:var(--text-lt);margin-top:4px;line-height:1.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec-ti{font-size:12px;font-weight:700;color:var(--navy-lt);margin:16px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--border);letter-spacing:.3px}
.sec-ti:first-child{margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--text-sub);user-select:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-dk);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:88vw;text-align:center}
.toast.err{background:var(--bad)}.toast.ok{background:var(--good)}
.fab{position:fixed;right:16px;bottom:20px;z-index:80;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:27px;cursor:pointer;box-shadow:0 4px 16px rgba(15,37,71,.35);display:flex;align-items:center;justify-content:center;line-height:1}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">📈 個別株ノート <small id="hdr-sub"></small></div>
  <span id="sync-status" class="save-status" style="display:none"></span>
  <button class="btn btn-white btn-sm" onclick="toggleMenu()">☰</button>
</header>

<div id="menu" class="menu hidden">
  <button class="menu-item" onclick="openSync()">🔗 GitHub同期の設定</button>
  <button class="menu-item" onclick="pullNow()">⬇️ GitHubから取得</button>
  <button class="menu-item" onclick="pushNow()">⬆️ GitHubへ保存</button>
  <hr class="menu-sep">
  <button class="menu-item" onclick="openSettings()">⚙️ 判定しきい値の設定</button>
  <button class="menu-item" onclick="toggleTheme()">🌓 テーマ切替</button>
  <hr class="menu-sep">
  <button class="menu-item" onclick="exportJSON()">💾 JSONをエクスポート</button>
  <button class="menu-item" onclick="importJSON()">📂 JSONをインポート</button>
  <button class="menu-item" onclick="loadSample()">🧪 サンプルデータを読込</button>
  <hr class="menu-sep">
  <button class="menu-item red" onclick="wipeAll()">🗑 全データを削除</button>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="list" onclick="setTab('list')">銘柄一覧</button>
  <button class="tab" data-tab="timeline" onclick="setTab('timeline')">判断タイムライン</button>
</nav>

<!-- ============ LIST ============ -->
<section id="view-list">
  <div class="fbar">
    <input class="fin" id="f-search" placeholder="銘柄名・コード・タグで検索" oninput="onFilter()">
    <select class="fsel" id="f-status" onchange="onFilter()">
      <option value="active">保有＋ウォッチ</option>
      <option value="all">すべて</option>
      <option value="holding">保有のみ</option>
      <option value="watching">ウォッチのみ</option>
      <option value="sold">売却済</option>
      <option value="archived">アーカイブ</option>
    </select>
    <select class="fsel" id="f-sort" onchange="onFilter()">
      <option value="updated">更新が新しい順</option>
      <option value="name">銘柄名順</option>
      <option value="ticker">コード順</option>
      <option value="per">予想PERが低い順</option>
      <option value="yield">配当利回りが高い順</option>
      <option value="roe">ROEが高い順</option>
      <option value="chg">値上がり率順</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- ============ TIMELINE ============ -->
<section id="view-timeline" class="hidden">
  <div class="stats" id="tl-stats"></div>
  <div style="padding:0 12px 90px;max-width:820px;margin:0 auto" id="timeline"></div>
</section>

<button class="fab" id="fab" onclick="openStockForm()" title="銘柄を追加">＋</button>

<!-- ============ DETAIL ============ -->
<section id="detail" class="detail hidden"></section>

<div id="modals"></div>
<div id="toast-host"></div>

<script>
'use strict';

/* ═══════════════ 定数 ═══════════════ */
const STORE='stock_note_v1', SYNC_STORE='stock_note_sync_v1', THEME_STORE='stock_note_theme';

const DEFAULT_SETTINGS={
  per_good:15, per_bad:25,
  pbr_good:1.0, pbr_bad:3.0,
  roe_good:8, roe_bad:5,
  yield_good:3.5, yield_bad:1.5,
  payout_bad:80,
  equity_good:50, equity_bad:30,
  opm_good:10, opm_bad:3,
  growth_good:10, growth_bad:0
};

const ACTIONS={
  buy_new  :{label:'新規買い', color:'--good'},
  buy_more :{label:'買い増し', color:'--good'},
  hold     :{label:'保有継続', color:'--text-sub'},
  sell_part:{label:'一部売却', color:'--warn'},
  sell_all :{label:'全売却',   color:'--bad'},
  pass     :{label:'見送り',   color:'--text-lt'},
  watch_in :{label:'ウォッチ入り', color:'--navy-lt'},
  watch_out:{label:'ウォッチ外し', color:'--text-lt'}
};
const STATUS={holding:'保有',watching:'ウォッチ',sold:'売却済',archived:'アーカイブ'};
const PERIODS={Q1:'第1四半期',Q2:'第2四半期',Q3:'第3四半期',Q4:'第4四半期',FY:'通期'};

/* ═══════════════ 状態 ═══════════════ */
let db={settings:{...DEFAULT_SETTINGS},stocks:[]};
let filters={search:'',status:'active',sort:'updated'};
let syncCfg=null, fileSha=null, syncTimer=null, searchTimer=null;
let currentTab='list', detailId=null, detailRange='3y', detailFundMode='FY';

/* ═══════════════ 汎用 ═══════════════ */
const $=id=>document.getElementById(id);
const uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const isNum=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const num=v=>isNum(v)?Number(v):null;

function fmt(v,dec=1,suffix=''){
  if(v===null||v===undefined||!isFinite(v)) return '—';
  return v.toLocaleString('ja-JP',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix;
}
function fmtPx(v,cur){
  if(v===null||!isFinite(v)) return '—';
  const dec = cur==='USD'?2:(Math.abs(v)<100?1:0);
  return v.toLocaleString('ja-JP',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtBig(v){
  if(v===null||!isFinite(v)) return '—';
  const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toLocaleString('ja-JP',{maximumFractionDigits:1})+'億';
  if(a>=1e4) return (v/1e4).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万';
  return v.toLocaleString('ja-JP');
}
function toast(msg,kind=''){
  const el=document.createElement('div');
  el.className='toast '+kind; el.textContent=msg;
  $('toast-host').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

/* ═══════════════ 保存 ═══════════════ */
function load(){
  try{
    const raw=localStorage.getItem(STORE);
    if(raw){
      const d=JSON.parse(raw);
      db={settings:{...DEFAULT_SETTINGS,...(d.settings||{})},stocks:(d.stocks||[]).map(migrate)};
    }

}
function migrate(s){
  s.prices=s.prices||[]; s.fundamentals=s.fundamentals||[];
  s.decisions=s.decisions||[]; s.events=s.events||[]; s.tags=s.tags||[];
  s.status=s.status||'watching';
  s.prices.sort((a,b)=>a.date<b.date?-1:1);
  return s;
}
function persist(){
  db.lastUpdated=today();
  localStorage.setItem(STORE,JSON.stringify(db));
  scheduleSync();
}
const byId=id=>db.stocks.find(s=>s.id===id);

/* ═══════════════ 指標の算出 ═══════════════ */
// 通期EPS: 会社予想を優先し、無ければ直近通期実績
function annualEps(f){ return num(f?.guidance_eps) ?? (f?.period_type==='FY'? num(f?.eps):null); }
// その日時点で「知り得た」最新のファンダ情報
function availDate(f){ return (f.recorded_at||f.as_of||'').slice(0,10); }

function sortedFunds(s){
  return [...(s.fundamentals||[])].sort((a,b)=>{
    const x=availDate(a),y=availDate(b);
    return x===y ? (a.as_of<b.as_of?-1:1) : (x<y?-1:1);
  });
}
function fundAt(s,dateStr){
  const fs=sortedFunds(s); let best=null;
  for(const f of fs){ if(availDate(f)<=dateStr) best=f; else break; }
  return best;
}
const latestFund =s=>{const fs=sortedFunds(s);return fs.length?fs[fs.length-1]:null;};
const latestPrice=s=>{const p=s.prices||[];return p.length?p[p.length-1]:null;};

// 直近通期(FY)レコード
function latestFY(s){
  const fs=sortedFunds(s).filter(f=>f.period_type==='FY');
  return fs.length?fs[fs.length-1]:null;
}
// 前年同期のレコード（YoY算出用）
function yoyPeer(s,f){
  if(!f?.as_of) return null;
  const t=new Date(f.as_of+'T00:00:00').getTime();
  let best=null,bestGap=Infinity;
  for(const g of s.fundamentals){
    if(g===f||g.period_type!==f.period_type||!g.as_of) continue;
    const gap=Math.abs(t-new Date(g.as_of+'T00:00:00').getTime()-365*864e5);
    if(gap<bestGap&&gap<50*864e5){ best=g; bestGap=gap; }
  }
  return best;
}
function yoy(cur,prev){
  const a=num(cur),b=num(prev);
  if(a===null||b===null||b===0) return null;
  return (a-b)/Math.abs(b)*100;
}

// 現在のスナップショット指標をまとめて算出
function metrics(s){
  const p=latestPrice(s), f=latestFund(s), fy=latestFY(s);
  const price=p?num(p.close):null;
  const eps=annualEps(f) ?? annualEps(fy);
  const bps=num(f?.bps) ?? num(fy?.bps);
  const dps=num(f?.dps) ?? num(fy?.dps);
  const m={
    price, date:p?.date||null,
    per: (price!==null&&eps!==null&&eps>0)? price/eps : null,
    pbr: (price!==null&&bps!==null&&bps>0)? price/bps : null,
    yld: (price!==null&&dps!==null&&price>0)? dps/price*100 : null,
    roe: num(f?.roe) ?? num(fy?.roe),
    opm: num(f?.operating_margin) ?? num(fy?.operating_margin),
    equity: num(f?.equity_ratio) ?? num(fy?.equity_ratio),
    payout: num(f?.payout_ratio) ?? num(fy?.payout_ratio),
    eps, bps, dps, fund:f
  };
  m.earnYield = m.per? 100/m.per : null;
  // 前日比
  if((s.prices||[]).length>=2){
    const a=s.prices[s.prices.length-1], b=s.prices[s.prices.length-2];
    const x=num(a.close), y=num(b.close);
    if(x!==null&&y!==null&&y!==0) m.chg=(x-y)/y*100;
  }
  // YoY（同じ区分の前年同期と比較。無ければ直近2期の通期どうしで比較）
  m.revYoy=null; m.epsYoy=null;
  if(f){
    const prev=yoyPeer(s,f);
    if(prev){ m.revYoy=yoy(f.revenue,prev.revenue); m.epsYoy=yoy(f.eps,prev.eps); }
  }
  if(m.revYoy===null&&m.epsYoy===null){
    const fys=sortedFunds(s).filter(x=>x.period_type==='FY');
    if(fys.length>=2){
      const a=fys[fys.length-1], b=fys[fys.length-2];
      m.revYoy=yoy(a.revenue,b.revenue); m.epsYoy=yoy(a.eps,b.eps);
    }
  }
  // 52週レンジ
  const cut=daysAgo(365);
  const win=(s.prices||[]).filter(x=>x.date>=cut).map(x=>num(x.close)).filter(v=>v!==null);
  if(win.length>=2){
    m.low52=Math.min(...win); m.high52=Math.max(...win);
    m.pos52=m.high52>m.low52? (price-m.low52)/(m.high52-m.low52)*100 : null;
  }
  return m;
}

// 指標の良否判定（しきい値は設定で変更可能）
function judge(key,v){
  if(v===null||v===undefined||!isFinite(v)) return '';
  const t=db.settings;
  switch(key){
    case 'per':    return v<=0?'bad':v<=t.per_good?'good':v>=t.per_bad?'bad':'warn';
    case 'pbr':    return v<=t.pbr_good?'good':v>=t.pbr_bad?'bad':'warn';
    case 'yld':    return v>=t.yield_good?'good':v<=t.yield_bad?'bad':'warn';
    case 'roe':    return v>=t.roe_good?'good':v<=t.roe_bad?'bad':'warn';
    case 'opm':    return v>=t.opm_good?'good':v<=t.opm_bad?'bad':'warn';
    case 'equity': return v>=t.equity_good?'good':v<=t.equity_bad?'bad':'warn';
    case 'payout': return v>=t.payout_bad?'bad':v<=0?'':'good';
    case 'growth': return v>=t.growth_good?'good':v<=t.growth_bad?'bad':'warn';
    default: return '';
  }
}

// 派生指標の時系列（PER・PBR・配当利回り）
function derivedSeries(s,kind){
  const fs=sortedFunds(s); const out=[]; let i=-1, cur=null;
  for(const p of (s.prices||[])){
    while(i+1<fs.length && availDate(fs[i+1])<=p.date){ i++; cur=fs[i]; }
    const price=num(p.close);
    if(price===null||!cur){ continue; }
    let v=null;
    if(kind==='per'){ const e=annualEps(cur); if(e!==null&&e>0) v=price/e; }
    else if(kind==='pbr'){ const b=num(cur.bps); if(b!==null&&b>0) v=price/b; }
    else if(kind==='yld'){ const d=num(cur.dps); if(d!==null&&price>0) v=d/price*100; }
    if(v!==null&&isFinite(v)) out.push({date:p.date,v});
  }
  return out;
}

/* ═══════════════ SVG チャート ═══════════════ */
const TS=d=>new Date(d+'T00:00:00').getTime();

function niceTicks(min,max,count=5){
  if(!isFinite(min)||!isFinite(max)) return [];
  if(min===max){ return [min]; }
  const span=(max-min)/count;
  const mag=Math.pow(10,Math.floor(Math.log10(span)));
  const norm=span/mag;
  const s=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[]; let t=Math.ceil(min/s)*s;
  for(;t<=max+1e-9;t+=s) out.push(Number(t.toFixed(10)));
  return out;
}

/**
 * 折れ線／棒グラフの描画。
 * datasets: [{name,color,type:'line'|'bar',axis:'l'|'r',points:[{date,v}]}]
 * markers : [{date,label,color}]  株価チャートに判断ログを重ねる用
 */
function chartW(){
  const w=window.innerWidth||800;
  return Math.round(Math.min(880,Math.max(320,(w>1140?1100:w)-(w<640?46:62))));
}
function chart(datasets,opts={}){
  const W=opts.width||chartW(), H=opts.height||240;
  const ml=opts.ml??46, mr=opts.mr??(datasets.some(d=>d.axis==='r')?46:12), mt=10, mb=24;
  const iw=W-ml-mr, ih=H-mt-mb;
  const all=datasets.flatMap(d=>d.points);
  if(!all.length) return '<div class="note">データがありません</div>';

  const xs=all.map(p=>TS(p.date));
  const x0=opts.x0??Math.min(...xs), x1=opts.x1??Math.max(...xs);
  const X=t=>ml+(x1===x0?iw/2:(t-x0)/(x1-x0)*iw);

  const scale={};
  for(const ax of ['l','r']){
    const pts=datasets.filter(d=>(d.axis||'l')===ax).flatMap(d=>d.points).map(p=>p.v).filter(v=>isFinite(v));
    if(!pts.length){ continue; }
    let lo=Math.min(...pts), hi=Math.max(...pts);
    const hasBar=datasets.some(d=>(d.axis||'l')===ax&&d.type==='bar');
    if(hasBar) lo=Math.min(lo,0);
    if(lo===hi){ lo-=Math.abs(lo||1)*.1; hi+=Math.abs(hi||1)*.1; }
    else{ const pad=(hi-lo)*.08; lo-=pad; hi+=pad; }
    scale[ax]={lo,hi,Y:v=>mt+ih-(v-lo)/(hi-lo)*ih};
  }
  if(!scale.l&&!scale.r) return '<div class="note">データがありません</div>';
  const L=scale.l||scale.r;

  let g='';
  // 横グリッド＋左軸
  for(const t of niceTicks(L.lo,L.hi,4)){
    const y=L.Y(t);
    g+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${ml+iw}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    g+=`<text x="${ml-5}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-lt)" font-family="var(--mono)">${fmtAxis(t)}</text>`;
  }
  // 右軸
  if(scale.r&&scale.l){
    for(const t of niceTicks(scale.r.lo,scale.r.hi,4)){
      const y=scale.r.Y(t);
      g+=`<text x="${ml+iw+5}" y="${(y+3.5).toFixed(1)}" font-size="10" fill="var(--text-lt)" font-family="var(--mono)">${fmtAxis(t)}</text>`;
    }
  }
  // 基準線
  for(const rl of (opts.refLines||[])){
    const sc=scale[rl.axis||'l']; if(!sc) continue;
    if(rl.v<sc.lo||rl.v>sc.hi) continue;
    const y=sc.Y(rl.v);
    g+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${ml+iw}" y2="${y.toFixed(1)}" stroke="${rl.color||'var(--warn)'}" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>`;
    if(rl.label) g+=`<text x="${ml+iw-3}" y="${(y-4).toFixed(1)}" text-anchor="end" font-size="9.5" fill="${rl.color||'var(--warn)'}">${esc(rl.label)}</text>`;
  }
  // X軸ラベル
  const span=x1-x0, fmtX=span>3*365*864e5?'y':span>200*864e5?'ym':'md';
  const nx=Math.min(5,Math.max(2,Math.round(iw/110)));
  for(let i=0;i<=nx;i++){
    const t=x0+span*i/nx, x=X(t), d=new Date(t);
    const lab=fmtX==='y'?`${d.getFullYear()}`:fmtX==='ym'?`${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}`:`${d.getMonth()+1}/${d.getDate()}`;
    g+=`<text x="${x.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--text-lt)" font-family="var(--mono)">${lab}</text>`;
  }

  // 系列
  const bars=datasets.filter(d=>d.type==='bar');
  const barW=bars.length? Math.max(3,Math.min(28,iw/(Math.max(...bars.map(b=>b.points.length))*bars.length*1.5))) : 0;
  let bi=0;
  for(const d of datasets){
    const sc=scale[d.axis||'l']; if(!sc||!d.points.length) continue;
    if(d.type==='bar'){
      const off=(bi-(bars.length-1)/2)*barW;
      const zero=sc.Y(Math.max(sc.lo,Math.min(0,sc.hi)));
      for(const p of d.points){
        if(!isFinite(p.v)) continue;
        const x=X(TS(p.date))+off, y=sc.Y(p.v);
        const top=Math.min(y,zero), h=Math.max(1,Math.abs(y-zero));
        g+=`<rect x="${(x-barW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${d.color}" opacity=".85" rx="1"/>`;
      }
      bi++;
    }else{
      const pts=d.points.filter(p=>isFinite(p.v));
      if(!pts.length) continue;
      const path=pts.map((p,i)=>`${i?'L':'M'}${X(TS(p.date)).toFixed(1)},${sc.Y(p.v).toFixed(1)}`).join('');
      if(d.fill){
        const base=mt+ih;
        g+=`<path d="${path}L${X(TS(pts[pts.length-1].date)).toFixed(1)},${base}L${X(TS(pts[0].date)).toFixed(1)},${base}Z" fill="${d.color}" opacity=".08"/>`;
      }
      g+=`<path d="${path}" fill="none" stroke="${d.color}" stroke-width="${d.w||1.8}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(pts.length<=40) for(const p of pts) g+=`<circle cx="${X(TS(p.date)).toFixed(1)}" cy="${sc.Y(p.v).toFixed(1)}" r="2.4" fill="${d.color}"/>`;
    }
  }

  // 判断マーカー
  for(const mk of (opts.markers||[])){
    const t=TS(mk.date); if(t<x0-864e5||t>x1+864e5) continue;
    const x=X(t);
    g+=`<line x1="${x.toFixed(1)}" y1="${mt}" x2="${x.toFixed(1)}" y2="${mt+ih}" stroke="${mk.color}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
    g+=`<path d="M${x.toFixed(1)},${mt+ih-1}l-5,8h10Z" fill="${mk.color}"/>`;
    g+=`<title>${esc(mk.date)} ${esc(mk.label)}</title>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px" role="img">${g}</svg>`;
}
function fmtAxis(v){
  const a=Math.abs(v);
  if(a<1e-9) return '0';
  if(a>=1e8) return (v/1e8).toFixed(a>=1e9?0:1)+'億';
  if(a>=1e4) return (v/1e4).toFixed(a>=1e5?0:1)+'万';
  if(a>=1000) return v.toLocaleString('ja-JP',{maximumFractionDigits:0});
  if(a>=10) return v.toFixed(0);
  if(a>=1) return v.toFixed(1);
  return v.toFixed(2);
}

function sparkline(points,color){
  if(points.length<2) return '<div class="note" style="padding:12px 0">株価データ未登録</div>';
  const W=300,H=42,pad=3;
  const vs=points.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs);
  const xs=points.map(p=>TS(p.date)), x0=Math.min(...xs), x1=Math.max(...xs);
  const X=t=>x1===x0?W/2:(t-x0)/(x1-x0)*W;
  const Y=v=>hi===lo?H/2:pad+(1-(v-lo)/(hi-lo))*(H-pad*2);
  const path=points.map((p,i)=>`${i?'L':'M'}${X(TS(p.date)).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const rising=vs[vs.length-1]>=vs[0];
  const c=color||(rising?'var(--up)':'var(--down)');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">
    <path d="${path}L${W},${H}L0,${H}Z" fill="${c}" opacity=".07"/>
    <path d="${path}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}

/* レーダーチャート（5軸）— 採点式は下の SCORES に明示 */
const SCORES=[
  {key:'value', label:'割安度', calc:m=>avg([
      lin(m.per,30,8), lin(m.pbr,4,0.7)])},
  {key:'profit',label:'収益性', calc:m=>avg([
      lin(m.roe,0,20), lin(m.opm,0,20)])},
  {key:'safety',label:'財務健全性',calc:m=>avg([lin(m.equity,20,70)])},
  {key:'income',label:'配当', calc:m=>avg([
      lin(m.yld,0,5), m.payout===null?null:lin(m.payout,100,40)])},
  {key:'growth',label:'成長性', calc:m=>avg([
      lin(m.revYoy,-10,20), lin(m.epsYoy,-10,25)])}
];
function lin(v,zero,full){
  if(v===null||v===undefined||!isFinite(v)) return null;
  const t=(v-zero)/(full-zero);
  return Math.max(0,Math.min(1,t))*100;
}
function avg(arr){
  const a=arr.filter(v=>v!==null&&isFinite(v));
  return a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
}
function radar(m){
  const S=210,c=S/2,R=S/2-34;
  const vals=SCORES.map(s=>({label:s.label,v:s.calc(m)}));
  const n=vals.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(a)*r,c+Math.sin(a)*r];};
  let g='';
  for(const f of [.25,.5,.75,1]){
    const poly=vals.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(',')).join(' ');
    g+=`<polygon points="${poly}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  }
  vals.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)"/>`;});
  const known=vals.filter(v=>v.v!==null);
  if(known.length>=3){
    const poly=vals.map((v,i)=>pt(i,R*((v.v??0)/100)).map(x=>x.toFixed(1)).join(',')).join(' ');
    g+=`<polygon points="${poly}" fill="var(--c1)" fill-opacity=".22" stroke="var(--c1)" stroke-width="2"/>`;
    vals.forEach((v,i)=>{ if(v.v===null) return; const[x,y]=pt(i,R*(v.v/100));
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--c1)"/>`; });
  }
  vals.forEach((v,i)=>{
    const[x,y]=pt(i,R+17);
    const anchor=Math.abs(x-c)<6?'middle':(x>c?'start':'end');
    g+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--text-sub)">${v.label}</text>`;
    g+=`<text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${anchor}" font-size="10" fill="var(--text-lt)" font-family="var(--mono)">${v.v===null?'—':Math.round(v.v)}</text>`;
  });
  const msg=known.length>=3?'':'<div class="note" style="padding:4px 0 0">指標が3軸以上そろうと形が表示されます</div>';
  return `<svg viewBox="0 0 ${S} ${S}" style="width:100%;max-width:250px;height:auto;margin:0 auto;display:block">${g}</svg>${msg}`;
}

/* 過去レンジ内の位置バンド
   goodDir='low'  … 低いほど良い指標（PER・PBR）
   goodDir='high' … 高いほど良い指標（配当利回り）           */
function rangeBand(label,series,unit,goodDir,curVal){
  if(series.length<3) return '';
  const vs=series.map(p=>p.v);
  const lo=Math.min(...vs), hi=Math.max(...vs);
  const cur=(curVal!==null&&curVal!==undefined&&isFinite(curVal))?curVal:vs[vs.length-1];
  const raw=hi>lo?(cur-lo)/(hi-lo)*100:50;
  const pos=Math.max(0,Math.min(100,raw));
  const favor=goodDir==='low'?100-pos:pos;           // 高いほど自分にとって有利
  const tone=favor>=70?'good':favor<=30?'bad':'warn';
  let word;
  if(raw<-0.5)       word='期間内レンジを下回る';
  else if(raw>100.5) word='期間内レンジを上回る';
  else if(pos<=30)   word=goodDir==='low'?'レンジ下限に近い（割安圏）':'レンジ下限に近い';
  else if(pos>=70)   word=goodDir==='low'?'レンジ上限に近い（割高圏）':'レンジ上限に近い（妙味あり）';
  else               word='レンジ中位';
  const grad=goodDir==='low'?'var(--good-bg),var(--bg),var(--bad-bg)':'var(--bad-bg),var(--bg),var(--good-bg)';
  return `<div class="band">
    <div class="band-hd"><span>${esc(label)}の期間内レンジ</span>
      <b style="color:var(--${tone})">${word}（${Math.round(pos)}%）</b></div>
    <div class="band-bar" style="background:linear-gradient(90deg,${grad})">
      <div class="band-mk" style="left:${pos}%"></div></div>
    <div class="band-ax"><span>${fmt(lo,1,unit)}</span><span>現在 ${fmt(cur,1,unit)}</span><span>${fmt(hi,1,unit)}</span></div>
  </div>`;
}

/* ═══════════════ 一覧 ═══════════════ */
function visibleStocks(){
  let list=[...db.stocks];
  const q=filters.search.trim().toLowerCase();
  if(q) list=list.filter(s=>[s.name,s.ticker,s.sector,...(s.tags||[])].join(' ').toLowerCase().includes(q));
  const st=filters.status;
  if(st==='active') list=list.filter(s=>s.status==='holding'||s.status==='watching');
  else if(st!=='all') list=list.filter(s=>s.status===st);

  const cache=new Map(); const M=s=>{ if(!cache.has(s.id)) cache.set(s.id,metrics(s)); return cache.get(s.id); };
  const cmpNum=(a,b,get,asc)=>{
    const x=get(M(a)), y=get(M(b));
    if(x===null&&y===null) return 0;
    if(x===null) return 1; if(y===null) return -1;
    return asc? x-y : y-x;
  };
  switch(filters.sort){
    case 'name':   list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja')); break;
    case 'ticker': list.sort((a,b)=>String(a.ticker||'').localeCompare(String(b.ticker||''),'ja')); break;
    case 'per':    list.sort((a,b)=>cmpNum(a,b,m=>(m.per!==null&&m.per>0)?m.per:null,true)); break;
    case 'yield':  list.sort((a,b)=>cmpNum(a,b,m=>m.yld,false)); break;
    case 'roe':    list.sort((a,b)=>cmpNum(a,b,m=>m.roe,false)); break;
    case 'chg':    list.sort((a,b)=>cmpNum(a,b,m=>m.chg??null,false)); break;
    default:       list.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  }
  return list;
}

function renderList(){
  const list=visibleStocks();
  $('stats').textContent=`${list.length} 銘柄`+(db.stocks.length!==list.length?` / 全 ${db.stocks.length} 銘柄`:'');
  const g=$('grid');
  if(!list.length){
    g.innerHTML=`<div class="empty" style="grid-column:1/-1">
      <h3>${db.stocks.length?'該当する銘柄がありません':'まだ銘柄が登録されていません'}</h3>
      <p>${db.stocks.length?'検索条件を変えてみてください。':'右下の ＋ から銘柄を追加します。<br>使い勝手を先に確かめるなら、メニューから「サンプルデータを読込」もできます。'}</p>
      ${db.stocks.length?'':'<button class="btn btn-navy" onclick="openStockForm()">銘柄を追加する</button>'}</div>`;
    return;
  }
  g.innerHTML=list.map(s=>{
    const m=metrics(s);
    const cut=daysAgo(365);
    const sp=(s.prices||[]).filter(p=>p.date>=cut).map(p=>({date:p.date,v:num(p.close)})).filter(p=>p.v!==null);
    const last=(s.decisions||[]).slice().sort((a,b)=>a.date<b.date?1:-1)[0];
    const cell=(lab,val,key,dec,suf)=>{
      const cls=val===null?'na':judge(key,val);
      return `<div class="mcell"><div class="mlab">${lab}</div><div class="mval ${cls}">${val===null?'—':fmt(val,dec,suf||'')}</div></div>`;
    };
    return `<article class="card" onclick="openDetail('${s.id}')">
      <div class="card-hd">
        <div style="flex:1;min-width:0">
          <div class="tick">${esc(s.ticker||'')}${s.sector?' · '+esc(s.sector):''}</div>
          <div class="cname">${esc(s.name||'(名称未設定)')}</div>
        </div>
        <span class="badge b-${s.status}">${STATUS[s.status]||''}</span>
      </div>
      <div class="card-px">
        <span class="px">${m.price===null?'—':fmtPx(m.price,s.currency)}</span>
        <span style="font-size:11px;color:var(--text-lt)">${s.currency==='USD'?'USD':'円'}</span>
        ${m.chg!==undefined&&m.chg!==null?`<span class="chg ${m.chg>=0?'up':'down'}">${m.chg>=0?'+':''}${m.chg.toFixed(2)}%</span>`:''}
      </div>
      <div class="spark">${sparkline(sp)}</div>
      <div class="mrow">
        ${cell('予想PER',m.per,'per',1,'倍')}
        ${cell('PBR',m.pbr,'pbr',2,'倍')}
        ${cell('配当利回り',m.yld,'yld',2,'%')}
        ${cell('ROE',m.roe,'roe',1,'%')}
      </div>
      ${(s.tags||[]).length?`<div class="tags" style="padding-top:8px">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      <div class="card-ft">${last?`<span class="act" style="background:var(--bg);color:var(${ACTIONS[last.action]?.color||'--text-sub'})">${ACTIONS[last.action]?.label||''}</span><span>${esc(last.date)}</span>`:'<span style="color:var(--text-lt)">判断ログ未記録</span>'}</div>
    </article>`;
  }).join('');
}

/* ═══════════════ タイムライン ═══════════════ */
function renderTimeline(){
  const rows=[];
  for(const s of db.stocks){
    for(const d of (s.decisions||[])) rows.push({...d,kind:'decision',stock:s});
    for(const e of (s.events||[]))    rows.push({...e,kind:'event',stock:s});
  }
  rows.sort((a,b)=>a.date<b.date?1:-1);
  $('tl-stats').textContent=`${rows.length} 件の記録`;
  const el=$('timeline');
  if(!rows.length){
    el.innerHTML='<div class="empty"><h3>まだ記録がありません</h3><p>銘柄の詳細画面から、売買判断やイベントを記録できます。</p></div>';
    return;
  }
  el.innerHTML=rows.map(r=>{
    const a=ACTIONS[r.action];
    return `<div class="dec" style="border-left-color:var(${a?.color||'--border'});cursor:pointer" onclick="openDetail('${r.stock.id}')">
      <div class="dec-hd">
        <span class="dec-dt">${esc(r.date)}</span>
        <strong style="font-size:13px">${esc(r.stock.name)}</strong>
        <span class="tick">${esc(r.stock.ticker||'')}</span>
        ${a?`<span class="act" style="background:var(--bg);color:var(${a.color})">${a.label}</span>`:'<span class="act" style="background:var(--bg);color:var(--text-sub)">イベント</span>'}
        ${isNum(r.price)?`<span class="conv">@${fmtPx(num(r.price),r.stock.currency)}</span>`:''}
        ${r.conviction?`<span class="conv">確信度 ${r.conviction}/5</span>`:''}
      </div>
      <div class="dec-rt">${esc(r.rationale||r.note||'')}</div>
    </div>`;
  }).join('');
}

/* ═══════════════ 詳細 ═══════════════ */
function openDetail(id){ detailId=id; detailRange='3y'; renderDetail(); }
function closeDetail(){ detailId=null; $('detail').classList.add('hidden'); document.body.style.overflow=''; render(); }
function setRange(r){ detailRange=r; renderDetail(); }
function setFundMode(m){ detailFundMode=m; renderDetail(); }

function rangeCut(){
  return detailRange==='1y'?daysAgo(365):detailRange==='3y'?daysAgo(365*3):detailRange==='5y'?daysAgo(365*5):'0000-00-00';
}

function renderDetail(){
  const s=byId(detailId); if(!s){ closeDetail(); return; }
  const el=$('detail'); el.classList.remove('hidden'); document.body.style.overflow='hidden';
  const m=metrics(s), cut=rangeCut(), cur=s.currency;

  const px=(s.prices||[]).filter(p=>p.date>=cut).map(p=>({date:p.date,v:num(p.close)})).filter(p=>p.v!==null);
  const vol=(s.prices||[]).filter(p=>p.date>=cut).map(p=>({date:p.date,v:num(p.volume)})).filter(p=>p.v!==null);
  const decs=[...(s.decisions||[])].sort((a,b)=>a.date<b.date?1:-1);
  const markers=decs.filter(d=>d.date>=cut).map(d=>({date:d.date,label:(ACTIONS[d.action]?.label||'')+(d.rationale?' / '+d.rationale.slice(0,40):''),color:`var(${ACTIONS[d.action]?.color||'--text-sub'})`}));
  const evs=(s.events||[]).filter(e=>e.date>=cut).map(e=>({date:e.date,label:e.note||'イベント',color:'var(--c3)'}));

  // 通期と四半期は水準が違うため、同じグラフに混ぜない
  const fundsAll=sortedFunds(s).filter(f=>(f.as_of||'')>=cut);
  const hasFY=fundsAll.some(f=>f.period_type==='FY');
  const hasQ =fundsAll.some(f=>/^Q/.test(f.period_type||''));
  if(detailFundMode==='FY'&&!hasFY&&hasQ) detailFundMode='Q';
  if(detailFundMode==='Q' &&!hasQ &&hasFY) detailFundMode='FY';
  const funds=fundsAll.filter(f=>detailFundMode==='FY'?f.period_type==='FY':/^Q/.test(f.period_type||''));

  const perS=derivedSeries(s,'per').filter(p=>p.date>=cut);
  const yldS=derivedSeries(s,'yld').filter(p=>p.date>=cut);

                   ...markers.map(k=>k.date),...evs.map(e=>e.date)].filter(Boolean);

      <div class="tick">${esc(s.ticker||'')}${s.sector?' · '+esc(s.sector):''}${s.market?' · '+esc(s.market):''}</div>

        ${kpi('ROE',m.roe,'roe',1,'%')}

        ${kpi('配当性向',m.payout,'payout',1,'%')}

2026-08-13,2845,9800000

      <div class="hint">「日付,終値,出来高」の順。出来高は省略可。ヘッダー行・カンマ区切りの桁区切り・引用符は自動で除去します。同じ日付は上書きされます。</div>

function savePrices(sid){
  const s=byId(sid); if(!s) return;
  const map=new Map((s.prices||[]).map(p=>[p.date,p]));
  let n=0, bad=0;

  const d=val('pf-date'), c=val('pf-close');
  if(d&&c!==''){ map.set(d,{date:d,close:Number(c),volume:nval('pf-vol')}); n++; }

  for(const raw of val('pf-bulk').split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const cols=splitCsv(line);
    if(cols.length<2) continue;
    const date=normDate(cols[0]);
    const close=toNumber(cols[1]);
    if(!date||close===null||close<=0){ bad++; continue; }
    map.set(date,{date,close,volume:cols[2]!==undefined?toNumber(cols[2]):null});
    n++;
  }
  if(!n){ toast('取り込める行がありませんでした','err'); return; }
  s.prices=[...map.values()].sort((a,b)=>a.date<b.date?-1:1);
  s.updated_at=new Date().toISOString();
  persist(); closeModal(); renderDetail();
  toast(`${n}日分を取り込みました${bad?`（${bad}行はスキップ）`:''}`,'ok');
}
// 引用符で囲まれた桁区切りを壊さずに1行を分解する
function splitCsv(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    }
    else if(ch==='"') q=true;
    else if(ch===','||ch==='\t'||ch===';'){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(x=>x.trim());
}
function toNumber(s){
  if(s===undefined||s===null) return null;
  const t=String(s).replace(/[,\s"'円]/g,'');
  if(t==='') return null;
  const v=Number(t);
  return isFinite(v)?v:null;
}
function normDate(s){
  const t=String(s).trim();
  let m=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=t.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

/* ═══════════════ GitHub 同期 ═══════════════ */
function loadSyncCfg(){
  try{ const raw=localStorage.getItem(SYNC_STORE);
    if(raw){ const c=JSON.parse(raw); syncCfg=c; fileSha=c.sha||null; } }catch(e){}
}
function saveSyncCfg(){
  syncCfg? localStorage.setItem(SYNC_STORE,JSON.stringify({...syncCfg,sha:fileSha}))
         : localStorage.removeItem(SYNC_STORE);
}
const b64enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

function syncStatus(state,msg){
  const el=$('sync-status'); if(!el) return;
  if(!state){ el.style.display='none'; return; }
  el.style.display='';
  el.className='save-status '+(state==='syncing'?'pending':state);
  el.innerHTML=`<span class="dot${state==='syncing'?' spin':''}"></span> ${msg||(state==='ok'?'同期済み':state==='err'?'同期失敗':'同期中…')}`;
  if(state==='ok') setTimeout(()=>{ if(el.className.includes('ok')) el.style.display='none'; },3000);
}
function apiUrl(){
  const [owner,repo]=(syncCfg.repo||'').split('/');
  return `https://api.github.com/repos/${owner}/${repo}/contents/${syncCfg.path||'data.json'}`;
}
async function pull(silent){
  if(!syncCfg?.token){ if(!silent) toast('先にGitHub同期を設定してください','err'); return false; }
  try{
    syncStatus('syncing');
    const res=await fetch(apiUrl(),{headers:{Authorization:`Bearer ${syncCfg.token}`,Accept:'application/vnd.github+json'}});
    if(res.status===404){ syncStatus(''); if(!silent) toast('同期先にまだファイルがありません','err'); return false; }
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const file=await res.json();
    fileSha=file.sha; saveSyncCfg();
    const d=JSON.parse(b64dec(file.content));
    if(d&&Array.isArray(d.stocks)){
      db={settings:{...DEFAULT_SETTINGS,...(d.settings||{})},stocks:d.stocks.map(migrate)};
      localStorage.setItem(STORE,JSON.stringify(db));
      syncStatus('ok'); render(); if(detailId) renderDetail();
      return true;
    }
    syncStatus(''); return false;
  }catch(e){
    console.error(e); syncStatus('err');
    if(!silent) toast('取得に失敗しました。トークンとリポジトリ設定を確認してください','err');
    return false;
  }
}
async function push(silent){
  if(!syncCfg?.token){ if(!silent) toast('先にGitHub同期を設定してください','err'); return false; }
  try{
    syncStatus('syncing');
    const body={message:`個別株ノート更新 (${db.stocks.length}銘柄)`,
      content:b64enc(JSON.stringify(db,null,2)),...(fileSha?{sha:fileSha}:{})};
    let res=await fetch(apiUrl(),{method:'PUT',
      headers:{Authorization:`Bearer ${syncCfg.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)});
    if(res.status===409||res.status===422){
      // sha 不整合 → 最新の sha を取り直して再試行
      const head=await fetch(apiUrl(),{headers:{Authorization:`Bearer ${syncCfg.token}`,Accept:'application/vnd.github+json'}});
      if(head.ok){ fileSha=(await head.json()).sha;
        res=await fetch(apiUrl(),{method:'PUT',
          headers:{Authorization:`Bearer ${syncCfg.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
          body:JSON.stringify({...body,sha:fileSha})});
      }
    }
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||`HTTP ${res.status}`); }
    fileSha=(await res.json()).content.sha; saveSyncCfg(); syncStatus('ok');
    return true;
  }catch(e){
    console.error(e); syncStatus('err');
    if(!silent) toast('保存に失敗しました: '+e.message,'err');
    return false;
  }
}
function scheduleSync(){

// 節目の株価（判断ログの価格）を通るように、平日のみの系列を生成する
function genPrices(anchors,vol,seed){
  const pts=anchors.filter(a=>a.date).sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2) return [];
  let r=seed, dev=0; const out=[];
  const end=new Date(pts[pts.length-1].date+'T00:00:00');
  for(const d=new Date(pts[0].date+'T00:00:00'); d<=end; d.setDate(d.getDate()+1)){
    const w=d.getDay(); if(w===0||w===6) continue;
    const ds=d.toISOString().slice(0,10);
    let i=0; while(i<pts.length-2&&pts[i+1].date<ds) i++;
    const a=pts[i], b=pts[i+1];
    const t0=TS(a.date), t1=TS(b.date);
    const f=t1===t0?0:Math.max(0,Math.min(1,(TS(ds)-t0)/(t1-t0)));
    const base=a.price*Math.pow(b.price/a.price,f);      // 節目間は対数直線で補間
    r=(r*1103515245+12345)&0x7fffffff;
    const rnd=r/0x7fffffff-0.5;
    dev=dev*0.94+rnd*vol;                                 // ゆるやかに揺らす
    out.push({date:ds,close:Math.round(base*(1+dev)*10)/10,
      volume:Math.round((0.75+Math.abs(rnd)*2.2)*1.1e6)});
  }
  return out;
}

/* ═══════════════ UI 制御 ═══════════════ */
function toggleMenu(){ $('menu').classList.toggle('hidden'); }
function closeMenu(){ $('menu').classList.add('hidden'); }
document.addEventListener('click',e=>{
  if(!$('menu').classList.contains('hidden')&&!e.target.closest('#menu')&&!e.target.closest('.hdr button')) closeMenu();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('modals').innerHTML) closeModal();
  else if(detailId) closeDetail();
  else closeMenu();
});
function setTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  $('view-list').classList.toggle('hidden',t!=='list');
  $('view-timeline').classList.toggle('hidden',t!=='timeline');
  $('fab').classList.toggle('hidden',t!=='list');
  render();
}
function onFilter(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    filters.search=$('f-search').value;
    filters.status=$('f-status').value;
    filters.sort=$('f-sort').value;
    renderList();
  },160);
}
function toggleTheme(){
  closeMenu();
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(THEME_STORE,next);
  if(detailId) renderDetail();
}
let resizeTimer=null, lastW=window.innerWidth;
addEventListener('resize',()=>{
  if(Math.abs(window.innerWidth-lastW)<40) return;
  lastW=window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ if(detailId) renderDetail(); else render(); },220);
});
function render(){
  if(currentTab==='list') renderList(); else renderTimeline();
  const n=db.stocks.length;
  $('hdr-sub').textContent=n?`${n}銘柄`:'';
}

/* ═══════════════ 起動 ═══════════════ */
(function init(){
  const th=localStorage.getItem(THEME_STORE);
  if(th) document.documentElement.setAttribute('data-theme',th);
  load(); loadSyncCfg(); render();
  if(syncCfg?.token) pull(true);
  addEventListener('beforeunload',()=>{ if(syncTimer){ clearTimeout(syncTimer); } });
})();
</script>
